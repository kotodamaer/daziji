<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>真正的手机</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body, html { 
            width: 100%; height: 100%; 
            font-family: 'Courier New', Courier, monospace; 
            overflow: hidden;
            transition: background-color 0.3s, color 0.3s;
            background-color: var(--bg-color);
            display: flex; justify-content: center;
        }

        :root {
            --bg-color: #f5f5f5;
            --text-color: #222;
            --card-bg: #ffffff;
            --card-shadow: 0 4px 15px rgba(0,0,0,0.05);
            --border-color: #ddd;
            --nav-bg: #ffffff;
            --nav-active: #4f9eff;
            --switch-green: #07c160;
        }
        body.dark {
            --bg-color: #1a1a1a;
            --text-color: #f0f0f0;
            --card-bg: #2a2a2a;
            --card-shadow: 0 4px 15px rgba(0,0,0,0.5);
            --border-color: #444;
            --nav-bg: #222;
            --nav-active: #80b8ff;
        }

        #phone-container {
            width: 100%; max-width: 400px; height: 100%;
            position: relative; background-color: var(--bg-color);
            display: flex; flex-direction: column; box-shadow: 0 0 30px rgba(0,0,0,0.2);
        }

        body { background-color: var(--bg-color); color: var(--text-color); }

        #top-bar { height: 35px; display: flex; justify-content: space-between; align-items: center; padding: 0 15px; font-size: 12px; color: #888; margin-top: 10px; z-index: 2; pointer-events: none; flex-shrink: 0; }

        #home-screen { flex: 1; padding: 0 15px 80px 15px; overflow-y: auto; display: flex; flex-direction: column; gap: 15px; }
        .top-row, .mid-row { display: flex; justify-content: space-between; gap: 10px; }
        .big-icon, .mid-icon { flex: 1; background: var(--card-bg); box-shadow: var(--card-shadow); border-radius: 12px; border: 1px solid var(--border-color); display: flex; flex-direction: column; align-items: center; justify-content: center; cursor: pointer; transition: transform 0.1s; color: var(--text-color); aspect-ratio: 1 / 0.8; padding: 10px; }
        .big-icon:active, .mid-icon:active { transform: scale(0.95); }
        .big-icon .emoji, .mid-icon .emoji { font-size: 24px; margin-bottom: 6px; }
        .big-icon .name, .mid-icon .name { font-size: 12px; text-align: center; }

        .photo-card { background: var(--card-bg); box-shadow: var(--card-shadow); border-radius: 12px; height: 140px; display: flex; flex-direction: column; align-items: center; justify-content: center; border: 1px solid var(--border-color); cursor: pointer; }
        .photo-card .emoji { font-size: 40px; margin-bottom: 10px; }

        #theme-toggle { position: absolute; bottom: 90px; right: 15px; width: 40px; height: 40px; border-radius: 50%; background: var(--card-bg); border: 1px solid var(--border-color); box-shadow: var(--card-shadow); display: flex; align-items: center; justify-content: center; cursor: pointer; transition: 0.2s; color: var(--text-color); font-size: 20px; z-index: 10; }

        #bottom-nav { height: 60px; background: var(--nav-bg); border-top: 1px solid var(--border-color); display: flex; justify-content: space-around; align-items: center; position: absolute; bottom: 0; width: 100%; z-index: 20; transition: background-color 0.3s; flex-shrink: 0; }
        .nav-item { flex: 1; display: flex; flex-direction: column; align-items: center; font-size: 12px; color: #888; cursor: pointer; transition: 0.2s; padding: 6px 0; }
        .nav-item .icon { font-size: 22px; margin-bottom: 2px; }
        .nav-item.active { color: var(--nav-active); }

        /* 打字机列表 */
        #msg-home { display: none; height: 100%; flex-direction: column; background: var(--bg-color); width: 100%; position: absolute; top:0; left:0; z-index: 30; }
        .msg-header { padding: 15px; border-bottom: 1px solid var(--border-color); font-size: 18px; color: var(--text-color); display: flex; justify-content: space-between; align-items: center; background: var(--bg-color); }
        .msg-header .back-home { color: #888; font-size: 14px; cursor: pointer; }
        .msg-header .add-btn { background: var(--card-bg); border: 1px solid var(--border-color); border-radius: 50%; width: 30px; height: 30px; display: flex; justify-content: center; align-items: center; font-size: 18px; cursor: pointer; color: var(--text-color); margin-left: 10px;}
        
        .msg-list { flex: 1; overflow-y: auto; padding: 10px; }
        .msg-list-item { display: flex; align-items: center; padding: 12px; border-bottom: 1px solid var(--border-color); cursor: pointer; color: var(--text-color); }
        .msg-list-item img { width: 40px; height: 40px; border-radius: 50%; margin-right: 12px; border: 2px solid var(--border-color); object-fit: cover; }
        .msg-list-item .info { flex: 1; }
        .msg-list-item .info .name { font-size: 15px; }
        .msg-list-item .info .desc { font-size: 12px; color: #777; margin-top: 4px; }

        /* 白纸/夜间聊天界面 */
        #chat-room { display: none; flex-direction: column; height: 100%; position: absolute; top: 0; left: 0; width: 100%; z-index: 35; }
        #chat-room .bg-layer { position: absolute; top: 0; left: 0; right: 0; bottom: 0; z-index: 0; pointer-events: none; }
        #chat-room .bg-layer.paper-light { background: #f5f5f0; }
        #chat-room .bg-layer.paper-dark { background: #1a1a1a; }
        #chat-room .bg-layer.image { background-size: cover; background-position: center; }
        
        /* 【暴破修复】强制把头部层级拉到最高，绝对不受干扰 */
        #chat-room .header { 
            display: flex; justify-content: space-between; align-items: center; 
            padding: 10px 15px; border-bottom: 1px solid #ddd; background: #fff; 
            flex-shrink: 0; 
            position: relative; 
            z-index: 50 !important; /* 强制盖住所有东西 */
        }
        #chat-room .header .back { color: #333; cursor: pointer; font-size: 16px; font-weight: bold; }
        #chat-room .header .title { color: #333; font-size: 16px; font-weight: bold; }
        #chat-room .header .more-btn { 
            color: #333; font-size: 22px; 
            cursor: pointer; padding: 0 10px; 
            font-weight: bold; line-height: 1; 
            z-index: 999; /* 按钮本身再升一级 */
            user-select: none;
        }
        
        #chat-room .content { flex: 1; padding: 15px; overflow-y: auto; position: relative; z-index: 1; display: flex; flex-direction: column; }
        .msg-row { display: flex; align-items: flex-start; margin-bottom: 12px; width: 100%; }
        .msg-row.sent { flex-direction: row-reverse; }
        .msg-row.received { flex-direction: row; }
        .msg-avatar { width: 40px; height: 40px; border-radius: 50%; object-fit: cover; flex-shrink: 0; background: #ddd; margin: 0 10px; }
        .msg-avatar.hidden { opacity: 0; }
        .msg-bubble { max-width: 70%; padding: 8px 14px; border-radius: 8px; word-wrap: break-word; font-size: 14px; }
        body.dark .msg-bubble { color: #eee; }
        .msg-row.sent .msg-bubble { background: #333; color: #fff; }
        .msg-row.received .msg-bubble { background: #fff; border: 1px solid #ddd; }
        body.dark .msg-row.received .msg-bubble { background: #2a2a2a; border: 1px solid #444; color: #eee; }

        #chat-room .footer { display: flex; align-items: center; padding: 8px 10px; background: #fff; border-top: 1px solid #ddd; z-index: 2; position: relative; flex-shrink: 0; }
        body.dark #chat-room .footer { background: #222; border-top: 1px solid #444; }
        #chat-room .footer input { flex: 1; padding: 8px 12px; border: 1px solid #ddd; border-radius: 20px; outline: none; background: #f9f9f9; margin-right: 8px; font-family: inherit; color: #333; }
        body.dark #chat-room .footer input { background: #333; border-color: #555; color: #eee; }
        #chat-room .footer .btn { background: transparent; border: none; font-size: 18px; cursor: pointer; color: #555; padding: 0 5px; }
        #plus-menu { display: none; position: absolute; bottom: 50px; right: 10px; background: #fff; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.2); padding: 10px; z-index: 20; width: 130px; border: 1px solid #eee; flex-direction: column; }
        body.dark #plus-menu { background: #2a2a2a; border: 1px solid #444; }
        #plus-menu .menu-item { display: flex; align-items: center; padding: 8px; cursor: pointer; border-radius: 6px; color: #333; font-size: 13px; }
        body.dark #plus-menu .menu-item { color: #eee; }

        /* 聊天设置 */
        #chat-settings { display: none; flex-direction: column; height: 100%; background: var(--bg-color); width: 100%; position: absolute; top:0; left:0; z-index: 40; }
        .settings-header { background: var(--card-bg); padding: 15px; border-bottom: 1px solid var(--border-color); display: flex; align-items: center; font-size: 16px; color: var(--text-color); font-weight: bold; flex-shrink: 0; }
        .settings-header .close-btn { font-size: 18px; cursor: pointer; margin-right: 15px; color: #888; }
        #settings-scroll-area { flex: 1; overflow-y: auto; padding-bottom: 80px; }
        .settings-avatar-section { display: flex; flex-direction: column; align-items: center; padding: 20px 0; background: var(--card-bg); margin: 15px 10px; border-radius: 8px; border: 1px solid var(--border-color); }
        .settings-avatar-preview { width: 100px; height: 100px; border-radius: 50%; background: #222; border: 2px dashed var(--border-color); display: flex; align-items: center; justify-content: center; cursor: pointer; overflow: hidden; color: #888; font-size: 12px; }
        .settings-avatar-preview img { width: 100%; height: 100%; object-fit: cover; display: none; }
        .settings-section { background: var(--card-bg); margin: 15px 10px; border-radius: 8px; border: 1px solid var(--border-color); overflow: hidden; }
        .setting-row { display: flex; justify-content: space-between; align-items: center; padding: 14px 15px; border-bottom: 1px solid var(--border-color); color: var(--text-color); font-size: 14px; cursor: pointer; }
        .setting-row:last-child { border-bottom: none; }
        .setting-row .arrow { color: #999; }
        .setting-row input[type="text"] { flex: 1; margin-left: 10px; background: transparent; border: none; color: var(--text-color); outline: none; text-align: right; font-family: inherit; font-size: 14px; }
        .setting-row textarea { width: 100%; margin-top: 10px; background: var(--bg-color); border: 1px solid var(--border-color); border-radius: 6px; padding: 8px; color: var(--text-color); resize: vertical; font-family: inherit; }
        
        .switch { position: relative; display: inline-block; width: 44px; height: 24px; flex-shrink: 0; }
        .switch input { opacity: 0; width: 0; height: 0; }
        .slider { position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0; background-color: #ccc; transition: .4s; border-radius: 24px; }
        .slider:before { position: absolute; content: ""; height: 20px; width: 20px; left: 2px; bottom: 2px; background-color: white; transition: .4s; border-radius: 50%; }
        input:checked + .slider { background-color: var(--switch-green); }
        input:checked + .slider:before { transform: translateX(20px); }

        .settings-save-area { position: absolute; bottom: 0; left: 0; width: 100%; background: var(--bg-color); padding: 10px; border-top: 1px solid var(--border-color); z-index: 10; box-sizing: border-box; flex-shrink: 0; }
        .settings-save-btn { padding: 14px; width: 100%; background: var(--switch-green); border: none; border-radius: 8px; color: #fff; font-size: 16px; cursor: pointer; font-weight: bold; }

        /* “我的”页面 */
        #my-page { display: none; flex-direction: column; background: var(--bg-color); width: 100%; position: absolute; top: 0; left: 0; z-index: 25; height: 100%; }
        .my-header { padding: 15px; border-bottom: 1px solid var(--border-color); font-size: 18px; display: flex; justify-content: space-between; color: var(--text-color); align-items: center; background: var(--card-bg); flex-shrink: 0; }
        .my-header .back { color: #888; font-size: 14px; cursor: pointer; }
        #my-scroll-area { flex: 1; overflow-y: auto; padding: 15px; display: flex; flex-direction: column; align-items: center; }
        .my-avatar-box { width: 100px; height: 100px; border-radius: 50%; background: #ccc; border: 3px solid var(--border-color); margin-bottom: 15px; overflow: hidden; cursor: pointer; position: relative; flex-shrink: 0; }
        .my-avatar-box img { width: 100%; height: 100%; object-fit: cover; display: none; }
        .my-avatar-box .placeholder { width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; font-size: 40px; color: #fff; background: #4f9eff; }
        .my-form-group { width: 100%; background: var(--card-bg); border-radius: 8px; border: 1px solid var(--border-color); padding: 15px; margin-top: 15px; }
        .my-form-row { display: flex; align-items: center; padding: 10px 0; border-bottom: 1px solid var(--border-color); }
        .my-form-row:last-child { border-bottom: none; display: block; }
        .my-form-row label { width: 60px; color: var(--text-color); font-size: 14px; font-weight: bold; flex-shrink: 0; }
        .my-form-row input { flex: 1; background: transparent; border: none; color: var(--text-color); outline: none; padding: 0 10px; font-family: inherit; font-size: 14px; }
        .my-form-row textarea { width: 100%; margin-top: 8px; background: var(--bg-color); border: 1px solid var(--border-color); border-radius: 6px; padding: 8px; color: var(--text-color); resize: vertical; font-family: inherit; box-sizing: border-box; }
        .my-save-btn { margin-top: 20px; width: 100%; padding: 14px; background: #4f9eff; border: none; border-radius: 8px; color: #fff; font-size: 16px; cursor: pointer; font-weight: bold; flex-shrink: 0; }

        /* 添加联系人浮窗 */
        #add-contact-overlay { display: none; position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.95); z-index: 45; padding: 20px; box-sizing: border-box; overflow-y: auto; }
        .back-btn-overlay { color: #aaa; cursor: pointer; font-size: 14px; margin-bottom: 20px; display: inline-block; }
        .add-form-title { text-align: center; font-size: 22px; margin-bottom: 20px; color: #fff; }
        .add-form label { display: block; font-size: 14px; color: #aaa; margin-top: 12px; margin-bottom: 5px; }
        .add-form input, .add-form textarea { width: 100%; padding: 10px; background: #1a1a1a; border: 1px solid #333; border-radius: 8px; color: #fff; font-family: inherit; box-sizing: border-box; }
        .add-form textarea { height: 60px; resize: none; }
        
        .add-avatar-box { width: 100px; height: 100px; border-radius: 50%; background: #222; border: 3px dashed #555; margin: 0 auto 15px auto; overflow: hidden; cursor: pointer; position: relative; display: flex; justify-content: center; align-items: center; color: #888; font-size: 12px; }
        .add-avatar-box img { width: 100%; height: 100%; object-fit: cover; display: none; }
        
        .confirm-add-btn { margin-top: 25px; width: 100%; padding: 14px; background: #4f9eff; border: none; border-radius: 8px; color: #fff; font-size: 16px; cursor: pointer; font-weight: bold; }
    </style>
</head>
<body>
    <div id="phone-container">
        <div id="top-bar">
            <span id="clock">9:41</span>
            <span>📶 5G 🔋 100%</span>
        </div>

        <!-- 主页 -->
        <div id="tab-home" class="app-page active">
            <div id="home-screen">
                <div class="top-row">
                    <div class="big-icon" onclick="openTypingMachine()"><div class="emoji">📜</div><div class="name">打字机</div></div>
                    <div class="big-icon" onclick="alert('世界书开发中')"><div class="emoji">📖</div><div class="name">世界书</div></div>
                    <div class="big-icon" onclick="alert('电话开发中')"><div class="emoji">📞</div><div class="name">电话</div></div>
                </div>
                <div class="photo-card" onclick="alert('相册开发中')"><div class="emoji">🖼️</div>图片相册</div>
                <div class="mid-row">
                    <div class="mid-icon" onclick="alert('商场开发中')"><div class="emoji">🛒</div><div class="name">商场</div></div>
                    <div class="mid-icon" onclick="alert('网关开发中')"><div class="emoji">🌐</div><div class="name">API网关</div></div>
                    <div class="mid-icon" onclick="openContactsApp()"><div class="emoji">👤</div><div class="name">联系人</div></div>
                    <div class="mid-icon" onclick="alert('设置开发中')"><div class="emoji">⚙️</div><div class="name">设置</div></div>
                </div>
            </div>
        </div>

        <!-- 打字机列表 -->
        <div id="msg-home">
            <div class="msg-header">
                <div>
                    <span id="msg-title">📜 打字机</span>
                    <span class="add-btn" onclick="openAddContact()">➕</span>
                </div>
                <div class="back-home" onclick="goHomeFromMsg()">返回桌面</div>
            </div>
            <div class="msg-list" id="msg-list-container"></div>
        </div>

        <!-- 聊天界面 -->
        <div id="chat-room">
            <div class="bg-layer paper-light" id="chat-bg-layer"></div>
            <div class="header">
                <div class="back" onclick="closeChatRoom()">← 返回</div>
                <div class="title" id="chat-partner-name">聊天中...</div>
                <!-- 【终极修复】不要用 onclick，交给 JS 底层去抓 -->
                <div class="more-btn" id="chat-more-btn">···</div>
            </div>
            <div class="content" id="chat-messages">
                <div style="text-align:center; color:#bbb; margin-top: 50px;">与好友开始聊天...</div>
            </div>
            <div class="footer">
                <input id="msg-input" type="text" placeholder="输入消息..." onkeydown="if(event.key==='Enter') sendMessage()">
                <button class="btn" onclick="sendMessage()">➤</button>
                <button class="btn" onclick="togglePlusMenu()">➕</button>
                <div id="plus-menu">
                    <div class="menu-item" onclick="doAction('发红包')">🧧 发红包</div>
                    <div class="menu-item" onclick="doAction('转账')">💸 转账</div>
                    <div class="menu-item" onclick="doAction('语音通话')">🎙️ 通话</div>
                    <div class="menu-item" onclick="doAction('代付')">🛍️ 代付</div>
                </div>
            </div>
        </div>

        <!-- 聊天设置 -->
        <div id="chat-settings">
            <div class="settings-header">
                <div class="close-btn" onclick="closeChatSettings()">✕</div>
                <span>聊天设置</span>
            </div>
            <div id="settings-scroll-area">
                <div class="settings-avatar-section">
                    <div class="settings-avatar-preview" onclick="document.getElementById('settings-avatar-upload').click()">
                        <span>点击上传</span>
                        <img id="settings-avatar-img" src="" alt="头像">
                    </div>
                    <input type="file" id="settings-avatar-upload" accept="image/*" style="display:none;">
                    <div style="margin-top:10px; font-size:14px; color:var(--text-color); font-weight:bold;" id="settings-avatar-name">昵称</div>
                </div>
                <div class="settings-section">
                    <div class="setting-row">昵称 <input id="s-name" type="text" placeholder="输入新昵称"></div>
                    <div class="setting-row" style="flex-direction: column; align-items: flex-start;">
                        <span style="margin-bottom: 5px;">外貌</span>
                        <textarea id="s-look" rows="2" placeholder="修改外貌描述..."></textarea>
                    </div>
                    <div class="setting-row" style="flex-direction: column; align-items: flex-start; border-bottom: none;">
                        <span style="margin-bottom: 5px;">经历</span>
                        <textarea id="s-history" rows="2" placeholder="修改经历描述..."></textarea>
                    </div>
                </div>
                <div class="settings-section" style="margin-top: 0;">
                    <div class="setting-row" onclick="alert('查找记录开发中')">查找聊天记录 <span class="arrow">›</span></div>
                </div>
                <div class="settings-section">
                    <div class="setting-row">消息免打扰 <label class="switch"><input type="checkbox"><span class="slider"></span></label></div>
                    <div class="setting-row">置顶聊天 <label class="switch"><input type="checkbox" checked><span class="slider"></span></label></div>
                    <div class="setting-row">提醒 <label class="switch"><input type="checkbox"><span class="slider"></span></label></div>
                </div>
                <div class="settings-section">
                    <div class="setting-row" onclick="document.getElementById('settings-bg-upload').click()">设置当前聊天背景 <span class="arrow">›</span></div>
                    <div class="setting-row" onclick="alert('清空记录开发中')">清空聊天记录 <span class="arrow">›</span></div>
                </div>
                <input type="file" id="settings-bg-upload" accept="image/*" style="display:none;">
                <div class="settings-section">
                    <div class="setting-row">允许对方查手机 <label class="switch"><input type="checkbox" checked><span class="slider"></span></label></div>
                    <div class="setting-row">发送增加表情包 <label class="switch"><input type="checkbox" checked><span class="slider"></span></label></div>
                    <div class="setting-row" style="border-bottom: none;">主动发信息 <label class="switch"><input type="checkbox"><span class="slider"></span></label></div>
                </div>
            </div>
            <div class="settings-save-area">
                <button class="settings-save-btn" onclick="saveChatSettings()">保存设置</button>
            </div>
        </div>

        <!-- 添加联系人浮窗 -->
        <div id="add-contact-overlay">
            <div class="back-btn-overlay" onclick="closeAddContact()">← 返回</div>
            <div class="add-form-title">添加联系人档案</div>
            <div class="add-form">
                <div class="add-avatar-box" onclick="document.getElementById('add-avatar-upload').click()">
                    <span style="font-size: 12px; color: #888;">点击上传头像</span>
                    <img id="add-avatar-img" src="" alt="">
                </div>
                <input type="file" id="add-avatar-upload" accept="image/*" style="display:none;">

                <label>姓名 (必填)</label>
                <input id="c-name" type="text" placeholder="输入姓名">
                <label>代号 (新增)</label>
                <input id="c-code" type="text" placeholder="输入代号">
                <label>外貌</label>
                <textarea id="c-look" placeholder="输入外貌描述..."></textarea>
                <label>性格</label>
                <textarea id="c-personality" placeholder="输入性格描述..."></textarea>
                <label>经历</label>
                <textarea id="c-history" placeholder="输入经历描述..."></textarea>
                <button class="confirm-add-btn" onclick="confirmAddContact()">确定添加</button>
            </div>
        </div>

        <!-- “我的”档案 -->
        <div id="my-page">
            <div class="my-header">
                <span>我的档案</span>
                <div class="back" onclick="goHome()">← 返回首页</div>
            </div>
            <div id="my-scroll-area">
                <div class="my-avatar-box" onclick="document.getElementById('my-avatar-upload').click()">
                    <div class="placeholder" id="my-avatar-placeholder">👤</div>
                    <img id="my-avatar-img" src="" alt="">
                </div>
                <input type="file" id="my-avatar-upload" accept="image/*" style="display:none;">

                <div class="my-form-group">
                    <div class="my-form-row">
                        <label>名字</label>
                        <input id="p-name" type="text" placeholder="输入你的名字">
                    </div>
                    <div class="my-form-row">
                        <label>代号</label>
                        <input id="p-code" type="text" placeholder="输入你的代号">
                    </div>
                    <div class="my-form-row" style="display: block;">
                        <label style="width:100%; margin-bottom:5px;">外貌</label>
                        <textarea id="p-look" rows="3" placeholder="输入外貌描述..."></textarea>
                    </div>
                    <div class="my-form-row" style="display: block; border-bottom: none;">
                        <label style="width:100%; margin-bottom:5px;">经历</label>
                        <textarea id="p-history" rows="3" placeholder="输入经历描述..."></textarea>
                    </div>
                </div>

                <button class="my-save-btn" onclick="saveProfile()">保存并载入世界书</button>
            </div>
        </div>

        <div id="theme-toggle" onclick="toggleTheme()">🌙</div>

        <div id="bottom-nav">
            <div class="nav-item active" onclick="goHome()"><div class="icon">🏠</div><div>首页</div></div>
            <div class="nav-item" onclick="openMyPage()"><div class="icon">🕴️</div><div>我的</div></div>
        </div>
    </div>

    <script>
        // ================= 导航与主题 =================
        function toggleTheme() {
            const body = document.body; const btn = document.getElementById('theme-toggle');
            if (body.classList.contains('dark')) { 
                body.classList.remove('dark'); 
                btn.innerText = '🌙'; 
                switchChatPaperBg('light');
            } else { 
                body.classList.add('dark'); 
                btn.innerText = '☀️'; 
                switchChatPaperBg('dark');
            }
        }

        function switchChatPaperBg(mode) {
            const layer = document.getElementById('chat-bg-layer');
            if(!layer.classList.contains('image')) {
                layer.className = `bg-layer paper-${mode}`;
            }
        }

        function goHome() {
            document.getElementById('my-page').style.display = 'none';
            document.getElementById('msg-home').style.display = 'none';
            document.getElementById('chat-room').style.display = 'none';
            document.getElementById('chat-settings').style.display = 'none';
            document.getElementById('add-contact-overlay').style.display = 'none';
            document.getElementById('tab-home').style.display = 'flex';
            document.getElementById('bottom-nav').style.display = 'flex';
            document.querySelectorAll('.nav-item').forEach(item => item.classList.remove('active'));
            document.querySelector('.nav-item:first-child').classList.add('active');
        }
        function openMyPage() {
            document.getElementById('my-page').style.display = 'flex';
            document.getElementById('tab-home').style.display = 'none';
            document.querySelectorAll('.nav-item').forEach(item => item.classList.remove('active'));
            document.querySelector('.nav-item:last-child').classList.add('active');
            loadProfileData();
        }

        // ================= 打字机 =================
        let currentChatPartner = null;
        let chatHistory = {};

        function openTypingMachine() {
            document.getElementById('msg-home').style.display = 'flex';
            document.getElementById('msg-title').innerText = '📜 打字机';
            document.getElementById('bottom-nav').style.display = 'none';
            renderMsgList();
        }
        function openContactsApp() {
            document.getElementById('msg-home').style.display = 'flex';
            document.getElementById('msg-title').innerText = '👤 联系人';
            document.getElementById('bottom-nav').style.display = 'none';
            renderMsgList();
        }
        function goHomeFromMsg() {
            document.getElementById('chat-room').style.display = 'none';
            document.getElementById('msg-home').style.display = 'none';
            document.getElementById('bottom-nav').style.display = 'flex';
            goHome();
        }

        function renderMsgList() {
            const container = document.getElementById('msg-list-container');
            container.innerHTML = '';
            const contacts = JSON.parse(localStorage.getItem('myPhoneContacts')) || [];
            if (contacts.length === 0) {
                container.innerHTML = `<div style="text-align:center; color:#555; margin-top:50px;">暂无联系人，点击上方➕添加</div>`;
                return;
            }
            contacts.reverse().forEach(contact => {
                const item = document.createElement('div');
                item.className = 'msg-list-item';
                const avatarImg = document.createElement('img');
                avatarImg.src = contact.avatar || 'https://ui-avatars.com/api/?name=' + encodeURIComponent(contact.name) + '&background=333&color=fff&size=100';
                const infoDiv = document.createElement('div'); infoDiv.className = 'info';
                const nameDiv = document.createElement('div'); nameDiv.className = 'name'; nameDiv.innerText = contact.name;
                const descDiv = document.createElement('div'); descDiv.className = 'desc'; descDiv.innerText = contact.look || '暂无描述';
                infoDiv.appendChild(nameDiv); infoDiv.appendChild(descDiv);
                item.appendChild(avatarImg); item.appendChild(infoDiv);
                item.onclick = function() { enterChatRoom(contact); };
                container.appendChild(item);
            });
        }

        function enterChatRoom(contact) {
            currentChatPartner = contact;
            document.getElementById('msg-home').style.display = 'none';
            document.getElementById('chat-room').style.display = 'flex';
            document.getElementById('bottom-nav').style.display = 'none';
            document.getElementById('chat-partner-name').innerText = contact.name;
            renderChatHistory(contact.id);

            const layer = document.getElementById('chat-bg-layer');
            if(contact.bgImage) {
                layer.className = 'bg-layer image';
                layer.style.backgroundImage = `url(${contact.bgImage})`;
            } else {
                const isDark = document.body.classList.contains('dark');
                layer.className = `bg-layer paper-${isDark ? 'dark' : 'light'}`;
                layer.style.backgroundImage = 'none';
            }
        }

        function closeChatRoom() {
            document.getElementById('chat-room').style.display = 'none';
            document.getElementById('chat-settings').style.display = 'none';
            document.getElementById('msg-home').style.display = 'flex';
            document.getElementById('plus-menu').style.display = 'none';
            renderMsgList();
        }

        // ================= 聊天设置 (三个点) =================
        // 【终极暴破修复】什么都不靠，只靠 DOM 加载完毕后的强制绑定
        window.onload = function() {
            const moreBtn = document.getElementById('chat-more-btn');
            if (moreBtn) {
                moreBtn.addEventListener('click', function(e) {
                    e.stopPropagation(); // 防止冒泡干扰
                    openChatSettings();
                });
                console.log("✅ 三个点事件绑定成功！"); // 控制台确认
            } else {
                console.error("❌ 找不到三个点按钮！");
            }
        };

        function openChatSettings() {
            if(!currentChatPartner) {
                alert("请先进入聊天界面再点击设置！");
                return;
            }
            // 联动逻辑
            document.getElementById('settings-avatar-img').src = currentChatPartner.avatar || '';
            document.getElementById('settings-avatar-img').style.display = currentChatPartner.avatar ? 'block' : 'none';
            document.getElementById('settings-avatar-preview').querySelector('span').style.display = currentChatPartner.avatar ? 'none' : 'block';
            document.getElementById('settings-avatar-name').innerText = currentChatPartner.name || '未知';
            
            document.getElementById('s-name').value = currentChatPartner.name || '';
            document.getElementById('s-look').value = currentChatPartner.look || '';
            document.getElementById('s-history').value = currentChatPartner.history || '';
            
            document.getElementById('chat-settings').style.display = 'flex';
        }

        function closeChatSettings() {
            document.getElementById('chat-settings').style.display = 'none';
        }

        // 设置页头像上传
        document.getElementById('settings-avatar-upload').addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(event) {
                    document.getElementById('settings-avatar-img').src = event.target.result;
                    document.getElementById('settings-avatar-img').style.display = 'block';
                    document.getElementById('settings-avatar-preview').querySelector('span').style.display = 'none';
                };
                reader.readAsDataURL(file);
            }
        });

        // 设置页背景上传
        document.getElementById('settings-bg-upload').addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (file && currentChatPartner) {
                const reader = new FileReader();
                reader.onload = function(event) {
                    const bgUrl = event.target.result;
                    const layer = document.getElementById('chat-bg-layer');
                    layer.className = 'bg-layer image';
                    layer.style.backgroundImage = `url(${bgUrl})`;
                    currentChatPartner.tempBgImage = bgUrl; 
                };
                reader.readAsDataURL(file);
            }
        });

        function saveChatSettings() {
            if(!currentChatPartner) return;
            const newAvatar = document.getElementById('settings-avatar-img').src;
            if(newAvatar && newAvatar !== '' && !newAvatar.includes('data:image')) { 
                currentChatPartner.avatar = newAvatar; 
            }
            
            currentChatPartner.name = document.getElementById('s-name').value;
            currentChatPartner.look = document.getElementById('s-look').value;
            currentChatPartner.history = document.getElementById('s-history').value;
            
            if(currentChatPartner.tempBgImage) {
                currentChatPartner.bgImage = currentChatPartner.tempBgImage;
                delete currentChatPartner.tempBgImage;
            }

            let contacts = JSON.parse(localStorage.getItem('myPhoneContacts')) || [];
            let index = contacts.findIndex(c => c.id === currentChatPartner.id);
            if(index !== -1) {
                contacts[index] = currentChatPartner;
                localStorage.setItem('myPhoneContacts', JSON.stringify(contacts));
            }

            document.getElementById('chat-partner-name').innerText = currentChatPartner.name;
            document.getElementById('settings-avatar-name').innerText = currentChatPartner.name;
            renderChatHistory(currentChatPartner.id);
            
            alert("✅ 保存设置成功！");
            closeChatSettings();
        }

        // ================= 聊天核心 =================
        function renderChatHistory(contactId) {
            const container = document.getElementById('chat-messages');
            container.innerHTML = ''; 
            const history = chatHistory[contactId] || [];
            const userData = JSON.parse(localStorage.getItem('myPhoneProfile')) || {};
            const myAvatar = userData.avatar || 'https://ui-avatars.com/api/?name=User&background=4f9eff&color=fff';
            const partnerAvatar = currentChatPartner ? (currentChatPartner.avatar || 'https://ui-avatars.com/api/?name=' + encodeURIComponent(currentChatPartner.name) + '&background=333&color=fff&size=100') : '';

            history.forEach((msg, index) => {
                const row = document.createElement('div'); row.className = `msg-row ${msg.isMe ? 'sent' : 'received'}`;
                const avatarImg = document.createElement('img'); avatarImg.className = 'msg-avatar'; avatarImg.src = msg.isMe ? myAvatar : partnerAvatar;
                if (index > 0 && history[index-1].isMe === msg.isMe) { avatarImg.classList.add('hidden'); }
                const bubble = document.createElement('div'); bubble.className = 'msg-bubble'; bubble.innerText = msg.text;
                row.appendChild(avatarImg); row.appendChild(bubble); container.appendChild(row);
            });
            container.scrollTop = container.scrollHeight; 
        }

        function sendMessage() {
            if (!currentChatPartner) { alert("请先选择一个联系人聊天！"); return; }
            const input = document.getElementById('msg-input');
            const text = input.value.trim();
            if (!text) return;
            if (!chatHistory[currentChatPartner.id]) chatHistory[currentChatPartner.id] = [];
            chatHistory[currentChatPartner.id].push({ text: text, isMe: true });
            setTimeout(() => {
                const replies = ["收到！", "你这话说的挺有意思。", "嗯，我在听。", "哈哈，好！", "要不要出去走走？"];
                chatHistory[currentChatPartner.id].push({ text: replies[Math.floor(Math.random() * replies.length)], isMe: false });
                renderChatHistory(currentChatPartner.id);
            }, 800);
            input.value = ''; renderChatHistory(currentChatPartner.id);
        }
        
        function togglePlusMenu() {
            const menu = document.getElementById('plus-menu');
            menu.style.display = menu.style.display === 'flex' ? 'none' : 'flex';
        }
        function doAction(action) { alert(`即将跳转到 [${action}]`); document.getElementById('plus-menu').style.display = 'none'; }

        // ================= 添加联系人 =================
        document.getElementById('add-avatar-upload').addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(event) {
                    const img = document.getElementById('add-avatar-img');
                    img.src = event.target.result;
                    img.style.display = 'block';
                    document.querySelector('#add-contact-overlay .add-avatar-box span').style.display = 'none';
                };
                reader.readAsDataURL(file);
            }
        });

        function openAddContact() {
            document.getElementById('add-contact-overlay').style.display = 'block';
        }
        function closeAddContact() {
            document.getElementById('add-contact-overlay').style.display = 'none';
        }

        function confirmAddContact() {
            const name = document.getElementById('c-name').value.trim();
            if (!name) { alert("请至少填写姓名！"); return; }
            
            const avatarImg = document.getElementById('add-avatar-img');
            const avatarData = avatarImg.style.display !== 'none' ? avatarImg.src : '';

            const newContact = { 
                id: Date.now(), 
                avatar: avatarData,
                name: name, 
                code: document.getElementById('c-code').value.trim(),
                look: document.getElementById('c-look').value.trim(),
                personality: document.getElementById('c-personality').value.trim(),
                history: document.getElementById('c-history').value.trim(),
                bgImage: null 
            };

            let contacts = JSON.parse(localStorage.getItem('myPhoneContacts')) || [];
            contacts.push(newContact);
            localStorage.setItem('myPhoneContacts', JSON.stringify(contacts));
            alert(`✅ 已添加：${name}`);
            closeAddContact();
            renderMsgList();
        }

        // ================= 我的页面 =================
        document.getElementById('my-avatar-upload').addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(event) {
                    document.getElementById('my-avatar-img').src = event.target.result;
                    document.getElementById('my-avatar-img').style.display = 'block';
                    document.getElementById('my-avatar-placeholder').style.display = 'none';
                };
                reader.readAsDataURL(file);
            }
        });

        function saveProfile() {
            const data = {
                avatar: document.getElementById('my-avatar-img').src,
                name: document.getElementById('p-name').value,
                code: document.getElementById('p-code').value,
                look: document.getElementById('p-look').value,
                history: document.getElementById('p-history').value
            };
            localStorage.setItem('myPhoneProfile', JSON.stringify(data));
            alert("✅ 档案已保存！");
        }
        
        function loadProfileData() {
            const saved = localStorage.getItem('myPhoneProfile');
            if (saved) {
                const data = JSON.parse(saved);
                if(data.avatar && data.avatar !== '') {
                    document.getElementById('my-avatar-img').src = data.avatar;
                    document.getElementById('my-avatar-img').style.display = 'block';
                    document.getElementById('my-avatar-placeholder').style.display = 'none';
                }
                document.getElementById('p-name').value = data.name || '';
                document.getElementById('p-code').value = data.code || '';
                document.getElementById('p-look').value = data.look || '';
                document.getElementById('p-history').value = data.history || '';
            }
        }

        function updateClock() {
            const now = new Date();
            const h = String(now.getHours()).padStart(2, '0');
            const m = String(now.getMinutes()).padStart(2, '0');
            document.getElementById('clock').innerText = h + ':' + m;
        }
        updateClock(); setInterval(updateClock, 1000);
    </script>
</body>
</html>
